name: OSC baseline vs safe performance

on:
  push:
    branches:
      - fix/300-safe-osc-dispatch

permissions:
  contents: read

jobs:
  compare:
    name: Compare OSC parsing on same runner
    runs-on: ubuntu-latest
    steps:
      - name: Check out original baseline
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline
          persist-credentials: false
      - name: Check out safe candidate
        uses: actions/checkout@v4
        with:
          ref: fix/300-safe-osc-dispatch
          path: candidate
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Prepare identical benchmark for both revisions
        run: |
          mkdir -p baseline/crates/anstyle-parse/examples
          mkdir -p candidate/crates/anstyle-parse/examples
          cp candidate/benchmarks/osc_dispatch_compare.rs baseline/crates/anstyle-parse/examples/osc_dispatch_compare.rs
          cp candidate/benchmarks/osc_dispatch_compare.rs candidate/crates/anstyle-parse/examples/osc_dispatch_compare.rs
      - name: Build baseline and candidate in release mode
        run: |
          (cd baseline && cargo build --release -p anstyle-parse@1.0.0 --example osc_dispatch_compare)
          (cd candidate && cargo build --release -p anstyle-parse@1.0.0 --example osc_dispatch_compare)
      - name: Benchmark ABBA order
        shell: bash
        run: |
          set -euo pipefail
          echo "revision,case,median_ns_per_osc,min_ns_per_osc,max_ns_per_osc,iterations,samples" > osc-benchmark.csv
          for revision in baseline candidate candidate baseline; do
            echo "Running: $revision"
            "$revision/target/release/examples/osc_dispatch_compare" | tail -n +2 | sed "s/^/$revision,/" | tee -a osc-benchmark.csv
          done
          cat osc-benchmark.csv
      - name: Upload measurements
        uses: actions/upload-artifact@v4
        with:
          name: osc-baseline-vs-safe-performance
          path: osc-benchmark.csv
